; Vorlage fuer NT4DNC.INI. Als NT4DNC.INI neben NT4DNC.EXE legen und die Werte anpassen.
; Echte Maschinennamen, Schluessel und Serveradressen nicht ins Repo schreiben.

[Server]
; IP-Adresse oder Name des Blazor-Servers, nur HTTP
Host=192.168.0.10
Port=5080

[Maschine]
; muss auf dem Server unter Dnc:Machines eingetragen sein
Name=TEST
Schluessel=nur-zum-testen

[Ablage]
; Hierhin schreibt NT4DNC die Programme
Ziel=C:\DNC\EIN
; Hierhin kommt die alte Fassung, bevor ein geaendertes Programm ersetzt wird
Sicherung=C:\DNC\ALT
; Lokales Protokoll, eine Zeile pro Uebertragung
Protokoll=C:\DNC\NT4DNC.LOG
